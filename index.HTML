<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Estudos - Allan Gomes Silva</title>
    

    


    <style>
        /* 1. RESET E BASE */
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
        }

        /* 2. MENU DE NAVEGAÇÃO SUPERIOR */
        .menu-principal {
            background-color: #333;
            padding: 15px;
            text-align: center;
            position: sticky; /* Faz o menu ficar fixo no topo ao rolar */
            top: 0;
            z-index: 1000;
        }

        .menu-principal a   .menu-principal {
    background-color: #333;
    padding: 10px;
    display: flex; /* Alinha os itens em linha */
    flex-wrap: wrap; /* Faz os botões pularem linha se faltar espaço */
    justify-content: center; /* Centraliza o menu */
    gap: 10px; /* Cria um espaço uniforme entre os botões */
    position: sticky;
    top: 0;
    z-index: 1000;
}

.menu-principal a {
    color: white;
    text-decoration: none;
    padding: 10px 15px;
    border-radius: 5px;
    background-color: #444;
    transition: 0.3s;
    font-weight: bold;
    font-size: 13px; /* Tamanho ajustado para caber melhor no celular */
    white-space: nowrap; /* Impede que o texto do botão quebre em duas linhas */
    display: inline-block;
}

.menu-principal a:hover {
    background-color: #bd4343;
}

        /* 3. HERO SECTION (IMAGEM PRINCIPAL) */
        .hero-home {
            background-image: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), 
                              url('https://media.istockphoto.com/id/1161294710/pt/foto/knowledge-and-inspiration.jpg?s=1024x1024&w=is&k=20&c=rSrHmvtSgcSSu7PlboAtRWnTOFdi6XlWcYbH-sfV934=');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            height: 50vh; /* Ajustado para não esconder os cards */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
        }

        .hero-home h1 {
            font-size: 3.5rem;
            margin-bottom: 10px;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.8);
            padding: 0 20px;
        }

        .hero-home p {
            font-size: 1.3rem;
            color: #ccc;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.7);
        }

/* 4. GRID DE MATÉRIAS (CARDS) - VERSÃO EQUILIBRADA */
.grid-materias {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 20px;
    margin: -50px auto 0; /* Sobreposição suave */
    padding: 0 20px;
    max-width: 1200px;
    position: relative;
    z-index: 2;
}

.materia-card {
    background: white;
    color: #333;
    text-decoration: none;
    padding: 30px 20px;
    border-radius: 12px;
    box-shadow: 0 6px 15px rgba(0,0,0,0.1);
    transition: all 0.3s ease;
    /* Largura flexível: mínimo 240px, cresce até preencher espaço */
    flex: 1 1 240px; 
    max-width: 300px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-bottom: 4px solid transparent; /* Preparo para o hover */
}

.materia-card:hover {
    transform: translateY(-8px);
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    background-color: #fff;
    border-bottom: 4px solid #bd4343; /* Cor destaque do seu menu */
}

.materia-card h3 {
    font-size: 1.3rem; /* Tamanho equilibrado */
    margin: 0;
    color: #002855; /* Cor padrão do seu simulado */
    line-height: 1.2;
}

/* Ajuste para o Menu não empilhar feio */
.menu-principal {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    padding: 15px;
    background-color: #333;
}

.menu-principal a {
    font-size: 0.85rem;
    padding: 8px 12px;
}
    </style>
</head>
<body>

  

    <header class="hero-home">
        <h1>BEM-VINDO AOS ESTUDOS</h1>
        <p>A persistência é o caminho do êxito.</p>
    </header>

    <section class="grid-materias">

        <h3>Português</h3>
    </a>

        <h3>Raciocínio Lógico</h3>
    </a>
    <a href="Curso Especifico.html" class="materia-card"> 
        <h3>Curso Especializado</h3>
    </a>
    <a href="Legistalção GO.html" class="materia-card">
        <h3>Legislação GO</h3>
    </a>
    <a href="simulado.html" class="materia-card">
        <h3>Simulado Fácil</h3>
    </a>
   

        
</section>

    

</body>
</html>
