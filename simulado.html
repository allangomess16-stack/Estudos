<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMULADO DINÂMICO - CÂMARA DE GOIÂNIA</title> 

    <style>    
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f0f2f5; scroll-behavior: smooth; }
        .menu-principal { background-color: #333; padding: 10px; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; position: sticky; top: 0; z-index: 1000; }
        .menu-principal a { color: white; text-decoration: none; padding: 10px 15px; border-radius: 5px; background-color: #444; transition: 0.3s; font-weight: bold; font-size: 13px; white-space: nowrap; }
        .menu-principal a:hover { background-color: #bd4343; }
        :root { --primary: #002855; --success: #28a745; --danger: #dc3545; }
        .container { max-width: 1000px; margin: 30px auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
        header { text-align: center; border-bottom: 4px solid #ad3131; margin-bottom: 20px; padding-bottom: 10px;}
        .cadastro-box { background: #f8f9fa; padding: 20px; border-radius: 8px; margin-bottom: 25px; border: 2px solid #ddd; }
        .cadastro-box input { width: 100%; padding: 12px; margin-top: 8px; border-radius: 4px; border: 1px solid #ccc; box-sizing: border-box; }
        .section-h { padding: 10px; border-radius: 5px; margin: 20px 0; font-weight: bold; color: white; text-transform: uppercase; text-align: center; }
        .bg-p { background: var(--primary); } .bg-l { background: #e65100; } .bg-g { background: #28a745; } .bg-e { background: #6a1b9a; }
        .question { margin-bottom: 15px; padding: 20px; border-left: 6px solid #ddd; border-bottom: 1px solid #eee; background: #fff; }
        .question.correct { border-left-color: var(--success); background: #e9f7ef; }
        .question.wrong { border-left-color: var(--danger); background: #fdf2f2; }
        .options label { display: block; padding: 10px; margin: 5px 0; border: 1px solid #eee; border-radius: 4px; cursor: pointer; }
        .btn-check { width: 100%; padding: 20px; background: #002855; color: white; border: none; border-radius: 8px; font-size: 1.2em; cursor: pointer; font-weight: bold; margin-top: 20px; }
        .erro-item { background: #fff; border: 1px solid #feb2b2; padding: 15px; margin-bottom: 10px; border-radius: 8px; border-left: 5px solid #c53030; }
        .ranking-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .ranking-table th, .ranking-table td { border: 1px solid #ddd; padding: 12px; text-align: center; }
        .ranking-table th { background: #333; color: white; }
    </style>
</head>
<body>

<nav class="menu-principal">
    <a href="index.html">RETORNAR AO MENU</a>
    <a href="portugues.html">PORTUGUÊS</a>
    <a href="raciocinio.html">RACIOCÍNIO</a>
    <a href="Curso Especifico.html">CURSO ESPECÍFICO</a>
    <a href="Legistalção GO.html">LEGISLAÇÃO E HISTÓRIA GO</a>
</nav>

<div style="position: sticky; top: 0; background: #fff; padding: 10px; border-bottom: 2px solid #ad3131; z-index: 1000; text-align: center;">
    <span style="font-size: 1.2em; font-weight: bold; color: #ad3131;">⏱️ TEMPO: <span id="timer">00:00:00</span></span>
</div>

<div class="container">
    <header>
        <h1>Simulado Inteligente - Allan Silva</h1>
    </header>

    <div class="cadastro-box">
        <label><b>Nome do Candidato:</b></label>
        <input type="text" id="nomeUser" placeholder="Digite seu nome completo">
    </div>

    <div id="resultadoFinalContainer" style="display:none; margin: 40px auto; max-width: 1000px;">
        <div style="padding:30px; border-radius:15px; text-align:center; border: 4px solid #ad3131; background: #fff; box-shadow: 0 10px 30px rgba(0,0,0,0.1);">
            <h2 style="color: #002855; margin-bottom: 25px;">📊 DESEMPENHO DO SIMULADO</h2>
            <div id="notasDetalhadas" style="display:grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; margin-bottom: 25px;"></div>
            <div id="notaTotalDestaque" style="font-size: 2.5em; font-weight: bold; color: #ad3131; background: #fdf2f2; padding: 20px; border-radius: 10px; margin-bottom: 15px;"></div>
            <p id="tempoGasto" style="font-size: 1.1em; color: #666; font-weight: bold; margin-bottom: 25px;"></p>

            <div style="display: flex; flex-direction: column; gap: 15px;">
                <button type="button" style="width:100%; padding:15px; background:#002855; color:white; border:none; border-radius:8px; cursor:pointer; font-size: 1.1em; font-weight:bold;" 
                    onclick="document.getElementById('relatorioErros').scrollIntoView({behavior: 'smooth'})">
                    📝 VER GABARITO COMENTADO ABAIXO
                </button>

                <button type="button" style="width:100%; padding:15px; background:#666; color:white; border:none; border-radius:8px; cursor:pointer; font-size: 1.1em; font-weight:bold;" 
                    onclick="document.getElementById('historicoSection').scrollIntoView({behavior: 'smooth'})">
                    🏆 VER MEU LUGAR NO RANKING
                </button>

                <button type="button" style="width:100%; padding:20px; background:#ad3131; color:white; border:none; border-radius:8px; cursor:pointer; font-size: 1.2em; font-weight:bold;" 
                    onclick="window.location.href='revisao_erros.html'">
                    🚀 ACESSAR MINHA MENTORIA DE ERROS (AULA)
                </button>
            </div>
        </div>
    </div>

    <form id="simuladoForm">
    <div id="containerGeralQuestoes"></div>
    
    <button type="button" class="btn-check" onclick="verificar()">FINALIZAR SIMULADO</button>
</form>

    <div id="relatorioErros" style="display:none; margin-top:40px;">
        <h2 style="color:#c53030; text-align:center;">📝 Revisão de Erros (Estude por aqui)</h2>
        <div id="listaErros"></div>
    </div>

    <div id="botaoPosGabarito" style="display:none; text-align:center; margin: 20px 0;">
        <button type="button" style="padding:15px 30px; background:#ad3131; color:white; border:none; border-radius:50px; cursor:pointer; font-size: 1.1em; font-weight:bold; box-shadow: 0 5px 15px rgba(173, 49, 49, 0.4);" 
            onclick="window.location.href='revisao_erros.html'">
            IR PARA PÁGINA DE REVISÃO ➜
        </button>
    </div>

    <div class="historico-section" id="historicoSection" style="display:none; margin-top:40px;">
        <h2 style="text-align:center;">📊 Meu Histórico de Desempenho</h2>
        <table class="ranking-table">
            <thead><tr><th>Pos</th><th>Nome</th><th>PT</th><th>RL</th><th>GO</th><th>INF</th><th>ESP</th><th>Média</th><th>Ação</th></tr></thead>
            <tbody id="tabelaCorpo"></tbody>
        </table>
    </div>
</div>

<script src="banco_mestre.js"></script>

<script>
let tempoSegundos = 0;
let intervaloTimer;
let dataSorteada = [];

function iniciarCronometro() {
    clearInterval(intervaloTimer); 
    tempoSegundos = 0;
    intervaloTimer = setInterval(() => {
        tempoSegundos++;
        const horas = Math.floor(tempoSegundos / 3600).toString().padStart(2, '0');
        const minutos = Math.floor((tempoSegundos % 3600) / 60).toString().padStart(2, '0');
        const segundos = (tempoSegundos % 60).toString().padStart(2, '0');
        document.getElementById('timer').innerText = `${horas}:${minutos}:${segundos}`;
    }, 1000);
}

function pararCronometro() {
    clearInterval(intervaloTimer);
    return document.getElementById('timer').innerText;
}

function prepararSimulado() {
    iniciarCronometro();
    const listaErrosAnteriores = JSON.parse(localStorage.getItem('allan_banco_erros')) || [];
    const filtrarMateria = (materia) => bancoDeDadosGeral.filter(q => q.s === materia);

    function sortearMateria(materia, quantidade) {
        const totalMateria = filtrarMateria(materia);
        const errosDaMateria = totalMateria.filter(q => listaErrosAnteriores.includes(q.id));
        const novasDaMateria = totalMateria.filter(q => !listaErrosAnteriores.includes(q.id));
        novasDaMateria.sort(() => 0.5 - Math.random());
        let combinadas = [...errosDaMateria, ...novasDaMateria];
        return combinadas.slice(0, quantidade);
    }

    // 1. Monta a prova respeitando as quantidades
    dataSorteada = [
        ...sortearMateria('p', 10),
        ...sortearMateria('l', 10),
        ...sortearMateria('g', 10),
        ...sortearMateria('i', 5),
        ...sortearMateria('e', 25)
    ];

    // 2. EMBARALHA TUDO para a numeração 1 a 60 fazer sentido
    dataSorteada.sort(() => 0.5 - Math.random());
    
    // 3. Limpa o container único
    const containerGeral = document.getElementById('containerGeralQuestoes');
    containerGeral.innerHTML = '';

    // 4. Renderiza em ordem linear absoluta
    dataSorteada.forEach((q, index) => {
        let opcoesFinais = [];

        // Lógica de alternativas dinâmicas
        if (q.distracoes && q.distracoes.length > 0) {
            let erradasSorteadas = [...q.distracoes].sort(() => 0.5 - Math.random()).slice(0, 3);
            opcoesFinais = [q.correta, ...erradasSorteadas].sort(() => 0.5 - Math.random());
            q.a = opcoesFinais.indexOf(q.correta);
            q.o = opcoesFinais; 
        } else {
            let textoDaCorreta = q.o[q.a];
            q.o = [...q.o].sort(() => 0.5 - Math.random());
            q.a = q.o.indexOf(textoDaCorreta);
        }

        const div = document.createElement('div');
        div.className = 'question'; 
        div.id = `q${q.id}-b`;
        
        // Exibe a matéria de forma discreta em cima da questão para você saber o que é
        const nomesMat = { p: 'PORTUGUÊS', l: 'RACIOCÍNIO LÓGICO', g: 'GOIÁS/LEGISLAÇÃO', i: 'INFORMÁTICA', e: 'ESPECÍFICAS' };
        
        div.innerHTML = `
            <small style="color: #666; font-weight: bold;">[${nomesMat[q.s]}]</small>
            <p><strong>${index + 1}. ${q.q}</strong> <small>(Peso ${q.p})</small></p>
            <div class="options">
                ${q.o.map((opcao, i) => `
                    <label>
                        <input type="radio" name="q${q.id}" value="${i}"> 
                        ${String.fromCharCode(65+i)}) ${opcao}
                    </label>
                `).join('')}
            </div>`;
        containerGeral.appendChild(div);
    });
}function verificar(event) {
    // Impede recarregamento se houver um evento de formulário
    if(event) event.preventDefault();

    const tempoFinal = pararCronometro();
    
    // Contadores de desempenho por matéria
    let acertosMat = { p: 0, l: 0, g: 0, i: 0, e: 0 };
    let totaisMat = { p: 0, l: 0, g: 0, i: 0, e: 0 };
    let notaFinalTotal = 0, pesoMaximoProva = 0;
    let errosSimuladoAtual = [];
    
    const nomeInput = document.getElementById('nomeUser').value.trim();
    const nome = nomeInput !== "" ? nomeInput : "Allan Silva";
    let bancoErrosGlobal = JSON.parse(localStorage.getItem('allan_banco_erros')) || [];

    dataSorteada.forEach(q => {
        pesoMaximoProva += q.p;
        totaisMat[q.s] += q.p;

        const selecionada = document.querySelector(`input[name="q${q.id}"]:checked`);
        const blocoQuestao = document.getElementById(`q${q.id}-b`);
        const respostaUser = selecionada ? parseInt(selecionada.value) : null;

        // A variável q.a já foi atualizada na função prepararSimulado() 
        // para bater com o índice correto após o embaralhamento.
        if(respostaUser === q.a) {
            notaFinalTotal += q.p; 
            acertosMat[q.s] += q.p;
            if(blocoQuestao) blocoQuestao.className = 'question correct';
            
            // Remove do banco de erros se acertar
            bancoErrosGlobal = bancoErrosGlobal.filter(id => id !== q.id);
        } else {
            if(blocoQuestao) blocoQuestao.className = 'question wrong';
            
            // Registra para o gabarito comentado (usa a letra correspondente ao índice q.a)
            errosSimuladoAtual.push({ 
                q: q.q, 
                letra: String.fromCharCode(65 + q.a), 
                resp: q.o[q.a], 
                exp: q.e 
            });
            
            // Adiciona ao banco de erros se não estiver lá
            if(!bancoErrosGlobal.includes(q.id)) {
                bancoErrosGlobal.push(q.id);
            }
        }
    });

    // Salva o progresso dos erros
    localStorage.setItem('allan_banco_erros', JSON.stringify(bancoErrosGlobal));
    
    const percFinalTotal = (notaFinalTotal / pesoMaximoProva) * 100;

    // --- RENDERIZAR RESULTADO NO CARD DE BAIXO ---
    const containerRes = document.getElementById('resultadoFinalContainer');
    containerRes.style.display = 'block';
    
    const nomesMat = { p: 'Português', l: 'Lógica', g: 'Goiás', i: 'Informática', e: 'Específicas' };
    
    document.getElementById('notasDetalhadas').innerHTML = Object.keys(totaisMat).map(m => {
        const porcMateria = totaisMat[m] > 0 ? ((acertosMat[m] / totaisMat[m]) * 100).toFixed(0) : 0;
        return `
            <div style="background:#f8f9fa; padding:15px; border:1px solid #eee; border-radius:10px; box-shadow: 2px 2px 5px rgba(0,0,0,0.05);">
                <small style="color:#888; font-weight:bold; text-transform:uppercase;">${nomesMat[m]}</small><br>
                <span style="font-size:1.5em; color:#002855; font-weight:bold;">${porcMateria}%</span>
            </div>`;
    }).join('');

    document.getElementById('notaTotalDestaque').innerText = `MÉDIA GERAL: ${percFinalTotal.toFixed(1)}%`;
    document.getElementById('tempoGasto').innerText = `⏱️ Tempo total de prova: ${tempoFinal}`;
    
    // Organiza dados para o Ranking
    const detalhesRanking = {
        p: totaisMat.p > 0 ? ((acertosMat.p/totaisMat.p)*100).toFixed(0) : 0,
        l: totaisMat.l > 0 ? ((acertosMat.l/totaisMat.l)*100).toFixed(0) : 0,
        g: totaisMat.g > 0 ? ((acertosMat.g/totaisMat.g)*100).toFixed(0) : 0,
        i: totaisMat.i > 0 ? ((acertosMat.i/totaisMat.i)*100).toFixed(0) : 0,
        e: totaisMat.e > 0 ? ((acertosMat.e/totaisMat.e)*100).toFixed(0) : 0
    };

    exibirRelatorioErros(errosSimuladoAtual);
    salvarDadosRanking(nome, notaFinalTotal.toFixed(1), percFinalTotal.toFixed(1), tempoFinal, detalhesRanking);

    // Rola para o card de resultados
    setTimeout(() => {
        containerRes.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 200);
}
function salvarDadosRanking(nome, nota, perc, tempo, detalhes) {
    let ranking = JSON.parse(localStorage.getItem('allan_ranking_global')) || [];
    ranking.push({ d: new Date().toLocaleDateString(), n: nome, nt: parseFloat(nota), p: parseFloat(perc), t: tempo, ts: tempoSegundos, detalhes: detalhes });
    ranking.sort((a, b) => (b.nt !== a.nt) ? b.nt - a.nt : a.ts - b.ts);
    localStorage.setItem('allan_ranking_global', JSON.stringify(ranking.slice(0, 15)));
    carregarRanking();
}

function carregarRanking() {
    const h = JSON.parse(localStorage.getItem('allan_ranking_global')) || [];
    const corpo = document.getElementById('tabelaCorpo');
    if(h.length > 0) {
        corpo.innerHTML = h.map((i, idx) => {
            let medalha = (idx === 0) ? '🥇' : (idx === 1) ? '🥈' : (idx === 2) ? '🥉' : (idx + 1) + 'º';
            const dt = i.detalhes || { p:0, l:0, g:0, i:0, e:0 };
            return `<tr><td>${medalha}</td><td><b>${i.n}</b><br><small>${i.d}</small></td><td>${dt.p}%</td><td>${dt.l}%</td><td>${dt.g}%</td><td>${dt.i}%</td><td>${dt.e}%</td><td><b>${i.p}%</b></td><td><button onclick="removerDoRanking(${idx})" style="background:none; border:none; cursor:pointer;">🗑️</button></td></tr>`;
        }).join('');
        document.getElementById('historicoSection').style.display = 'block';
    }
}

function removerDoRanking(index) {
    if (confirm("Deseja remover?")) {
        let ranking = JSON.parse(localStorage.getItem('allan_ranking_global')) || [];
        ranking.splice(index, 1);
        localStorage.setItem('allan_ranking_global', JSON.stringify(ranking));
        carregarRanking();
    }
}

function exibirRelatorioErros(erros) {
    const area = document.getElementById('relatorioErros');
    const lista = document.getElementById('listaErros');
    const btnPos = document.getElementById('botaoPosGabarito');
    if(erros.length > 0) {
        area.style.display = 'block';
        btnPos.style.display = 'block';
        lista.innerHTML = erros.map(e => `<div class="erro-item"><b>${e.q}</b><br>Correta: ${e.resp}</div>`).join('');
    } else { area.style.display = 'none'; btnPos.style.display = 'none'; }
}

window.onload = function() { prepararSimulado(); carregarRanking(); };
// --- FUNÇÃO VOLTAR AO TOPO ---

// Mostra o botão quando o usuário descer 300px da página
window.onscroll = function() {
    const btn = document.getElementById("btnTopo");
    if (document.body.scrollTop > 300 || document.documentElement.scrollTop > 300) {
        btn.style.display = "block";
    } else {
        btn.style.display = "none";
    }
};

// Faz a página subir suavemente
function voltarAoTopo() {
    window.scrollTo({
        top: 0,
        behavior: 'smooth'
    });
}
</script>
<button id="btnTopo" onclick="voltarAoTopo()" style="display: none; position: fixed; bottom: 20px; right: 20px; z-index: 1000; background-color: #333; color: white; border: none; padding: 15px; border-radius: 50%; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3); font-size: 20px; transition: 0.3s;" title="Voltar ao Topo">
    ⬆️
</button>
</body>
