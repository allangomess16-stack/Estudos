let tempoSegundos = 0;
let intervaloTimer;

function iniciarCronometro() {
    clearInterval(intervaloTimer); 
    tempoSegundos = 0;
    intervaloTimer = setInterval(() => {
        tempoSegundos++;
        const horas = Math.floor(tempoSegundos / 3600).toString().padStart(2, '0');
        const minutos = Math.floor((tempoSegundos % 3600) / 60).toString().padStart(2, '0');
        const segundos = (tempoSegundos % 60).toString().padStart(2, '0');
        document.getElementById('timer').innerText = `${horas}:${minutos}:${segundos}`;
    }, 1000);
}

function pararCronometro() {
    clearInterval(intervaloTimer);
    return document.getElementById('timer').innerText;
}

function prepararProva() {
    iniciarCronometro();
    const containerGeral = document.getElementById('containerGeralQuestoes');
    containerGeral.innerHTML = '';

    questoesALEGO.forEach((q, index) => {
        const div = document.createElement('div');
        div.className = 'question'; 
        div.id = `q${q.id}-b`;
        
        div.innerHTML = `
            <small style="color: #666; font-weight: bold;">[${q.tema}]</small>
            <p><strong>${index + 1}. ${q.q}</strong> <small>(Peso ${q.p})</small></p>
            <div class="options">
                ${q.o.map((opcao, i) => `
                    <label>
                        <input type="radio" name="q${q.id}" value="${i}"> 
                        ${String.fromCharCode(65+i)}) ${opcao}
                    </label>
                `).join('')}
            </div>`;
        containerGeral.appendChild(div);
    });
}

function verificar(event) {
    if(event) event.preventDefault();
    const tempoFinal = pararCronometro();
    let acertosMat = { p: 0, l: 0, g: 0, i: 0, d: 0, e: 0 };
    let totaisMat = { p: 0, l: 0, g: 0, i: 0, d: 0, e: 0 };
    let notaFinalTotal = 0, pesoMaximoProva = 0;
    let errosSimuladoAtual = [];
    const nome = document.getElementById('nomeUser').value.trim() || "Candidato";

    questoesALEGO.forEach(q => {
        pesoMaximoProva += q.p;
        totaisMat[q.s] += q.p;
        const sel = document.querySelector(`input[name="q${q.id}"]:checked`);
        const bloco = document.getElementById(`q${q.id}-b`);
        const respUser = sel ? parseInt(sel.value) : null;

        if(respUser === q.a) {
            notaFinalTotal += q.p; 
            acertosMat[q.s] += q.p;
            if(bloco) bloco.className = 'question correct';
        } else {
            if(bloco) bloco.className = 'question wrong';
            errosSimuladoAtual.push({ q: q.q, letra: String.fromCharCode(65 + q.a), resp: q.o[q.a], exp: q.e });
        }
    });

    const percFinalTotal = (notaFinalTotal / pesoMaximoProva) * 100;
    const containerRes = document.getElementById('resultadoFinalContainer');
    containerRes.style.display = 'block';
    
    // ATUALIZA CARD DE NOTAS
    const nomesMat = { p: 'Português', l: 'Lógica', g: 'Geografia', i: 'Informática', d: 'Direito', e: 'Específicas' };
    document.getElementById('notasDetalhadas').innerHTML = Object.keys(totaisMat).map(m => {
        const porc = totaisMat[m] > 0 ? ((acertosMat[m] / totaisMat[m]) * 100).toFixed(0) : 0;
        return `<div style="background:#f8f9fa; padding:15px; border:1px solid #eee; border-radius:10px;">
                <small style="color:#888; font-weight:bold;">${nomesMat[m]}</small><br>
                <span style="font-size:1.5em; color:#002855; font-weight:bold;">${porc}%</span>
                </div>`;
    }).join('');

    document.getElementById('notaTotalDestaque').innerText = `NOTA FINAL: ${percFinalTotal.toFixed(1)}%`;
    document.getElementById('tempoGasto').innerText = `⏱️ Tempo: ${tempoFinal}`;

    exibirRelatorioErros(errosSimuladoAtual);
    salvarDadosRanking(nome, notaFinalTotal.toFixed(1), percFinalTotal.toFixed(1));
    setTimeout(() => containerRes.scrollIntoView({ behavior: 'smooth', block: 'center' }), 200);
}

function exibirRelatorioErros(erros) {
    const area = document.getElementById('relatorioErros');
    const lista = document.getElementById('listaErros');
    if(erros.length > 0) {
        area.style.display = 'block';
        lista.innerHTML = erros.map(e => `<div class="erro-item"><b>${e.q}</b><br><span style="color:green">Correta: ${e.resp}</span><br><i>${e.exp}</i></div>`).join('');
    } else { area.style.display = 'none'; }
}

function salvarDadosRanking(nome, nota, perc) {
    let ranking = JSON.parse(localStorage.getItem('allan_ranking_alego_full')) || [];
    ranking.push({ n: nome, nt: nota, p: perc });
    ranking.sort((a, b) => b.p - a.p);
    localStorage.setItem('allan_ranking_alego_full', JSON.stringify(ranking.slice(0, 10)));
    carregarRanking();
}

function carregarRanking() {
    const h = JSON.parse(localStorage.getItem('allan_ranking_alego_full')) || [];
    const corpo = document.getElementById('tabelaCorpo');
    if(h.length > 0) {
        document.getElementById('historicoSection').style.display = 'block';
        corpo.innerHTML = h.map((i, idx) => `<tr><td>${idx+1}º</td><td>${i.n}</td><td>-</td><td>-</td><td>-</td><td>-</td><td>-</td><td>-</td><td><b>${i.p}%</b></td></tr>`).join('');
    }
}

window.onload = function() { prepararProva(); carregarRanking(); };
</script>
