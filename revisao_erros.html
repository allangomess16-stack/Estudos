<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MENTORIA DE ERROS - ALLAN SILVA</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; margin: 0; padding: 20px; line-height: 1.6; }
        .container { max-width: 900px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #ad3131; border-bottom: 3px solid #ad3131; padding-bottom: 10px; text-align: center; }
        
        /* Estilo dos blocos de aula */
        .tema-box { margin-bottom: 30px; border: 1px solid #ddd; border-radius: 8px; overflow: hidden; animation: fadeIn 0.5s ease; }
        .tema-header { background: #002855; color: white; padding: 12px 15px; font-weight: bold; font-size: 1.1em; display: flex; justify-content: space-between; }
        .conteudo { padding: 20px; background: #fff; }
        
        /* Estilos internos que você usa nas explicações */
        .dica { background: #f1f7ff; border-left: 5px solid #002855; padding: 15px; margin: 10px 0; border-radius: 4px; }
        .alerta { background: #fff1f1; border-left: 5px solid #ad3131; padding: 15px; margin: 10px 0; border-radius: 4px; }
        .tab-estudo { width: 100%; border-collapse: collapse; margin: 15px 0; }
        .tab-estudo th, .tab-estudo td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        .tab-estudo th { background: #f8f9fa; }
        .vs-container { display: flex; gap: 15px; flex-wrap: wrap; }
        
        .btn-voltar { display: block; width: 220px; margin: 30px auto; padding: 15px; background: #333; color: white; text-align: center; text-decoration: none; border-radius: 8px; font-weight: bold; transition: 0.3s; }
        .btn-voltar:hover { background: #ad3131; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="container">
    <h1>🚀 Minha Mentoria de Erros Completa</h1>
    <p style="text-align: center; color: #666;">Teoria baseada nas questões do banco de dados</p>

    <div id="listaGeralRevisao"></div>

    <a href="index.html" class="btn-voltar">⬅ VOLTAR AO SIMULADO</a>
</div>

<script src="banco_estudos.js"></script> 

<script>
    function carregarMentoriaCompleta() {
        const container = document.getElementById('listaGeralRevisao');
        
        // Verifica se o objeto bancoExplicações existe
        if (typeof bancoExplicações !== 'undefined') {
            // Transforma o objeto em uma lista e gera o HTML para cada um
            const htmlCompleto = Object.keys(bancoExplicações).map(id => `
                <div class="tema-box">
                    <div class="tema-header">
                        <span>${bancoExplicações[id].titulo}</span>
                        <small style="opacity: 0.7;">ID: ${id}</small>
                    </div>
                    <div class="conteudo">
                        ${bancoExplicações[id].corpo}
                    </div>
                </div>
            `).join('');

            container.innerHTML = htmlCompleto;
        } else {
            container.innerHTML = "<p style='text-align:center; color:red;'>Erro: Banco de explicações não encontrado.</p>";
        }
    }

    // Inicia ao carregar a página
    window.onload = carregarMentoriaCompleta;
</script>

</body>
</html>
